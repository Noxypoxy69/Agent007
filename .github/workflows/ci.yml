# THE SUITE, ON EVERY PUSH, ON A MACHINE NOBODY OWNS.
#
# This repo had no CI at all. "npm test passes" has meant "it passed on the
# machine of whoever ran it", and that is not the same claim: a suite can lean
# on a git identity, a HOME, a writable path or a network route that exists on
# one desktop and nowhere else. A clean runner is the only thing that can tell
# the difference, and the first time one ran this suite it found a failure that
# nobody's laptop reproduces.
#
# FAILURES ARE PRINTED LAST, ON PURPOSE. The log reader available to agents
# returns only the final few thousand lines, and a 1449-test TAP stream is far
# longer than that -- so a `not ok` in the middle is invisible, which is exactly
# how this failure stayed anonymous. The summary below is re-emitted at the end
# so it survives truncation.
#
# AND THE STEP FAILS ON THE SUITE'S OWN COUNT, not on a pipe's exit code.
# `npm test | tee` reports tee's status, which is the trap that made an earlier
# red run look green here.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/suite.txt || true

          echo ""
          echo "================ COUNTS ================"
          grep -E '^# (tests|pass|fail|skipped)' /tmp/suite.txt || true

          echo ""
          echo "================ FAILING TESTS ================"
          grep -nE '^ *not ok ' /tmp/suite.txt || echo "(none)"

          echo ""
          echo "================ DETAIL ================"
          # Everything from each failure marker to the end of its YAML block.
          awk '/^ *not ok /{p=1} p{print} /^ *\.\.\./{if(p&&++n>0)p=0}' /tmp/suite.txt | head -200 || true

          echo ""
          echo "================ VERDICT ================"
          # The suite's OWN reported count decides, never a pipeline's exit code.
          if grep -qE '^# fail 0$' /tmp/suite.txt; then
            echo "green"
          else
            echo "RED — see FAILING TESTS above"
            exit 1
          fi
