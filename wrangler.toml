name = "agentbridge"
main = "bridge/oauthWorker.mjs"
compatibility_date = "2026-09-15"
workers_dev = true

# THE PUBLIC FRONT DOOR: OAuth 2.1 discovery + the MCP resource.
#
# WHY THE WORKER SERVES OAUTH AND SUPABASE SERVES THE DATA. Discovery is defined
# at the ORIGIN ROOT -- /.well-known/oauth-protected-resource and
# /.well-known/oauth-authorization-server. A Supabase Edge Function is served
# under /functions/v1/<name>/ and can never answer at a root, so a compliant
# client looking there finds nothing. The Worker owns its whole origin.
#
#   this Worker              OAuth + MCP facade, public
#   Supabase Edge Function   data plane, reached at the granted scope
#
# THIS WORKER HOLDS TWO CREDENTIALS, AND THE SECOND ONE RAISES THE STAKES.
#
#   BRIDGE_READER_TOKEN       forwarded for a read grant
#   BRIDGE_COORDINATOR_TOKEN  forwarded ONLY for a grant carrying
#                             agentbridge:write, which the consent page issues
#                             only against the coordinator secret
#
# It held the reader token alone until scope-aware forwarding landed, and the
# honest consequence of adding the second is that compromising this Worker no
# longer yields read access and nothing more -- it yields the ability to assign
# work and send messages as the coordinator. That is the price of ChatGPT being
# able to act rather than only look, and it is exactly why a write grant is
# approved with a different secret from a read grant.
#
# The database service key still stays inside Supabase and is never copied
# here. Neither token can reach the database directly; both are scoped labels
# the data plane resolves, and either can be revoked by flipping one column
# without disturbing the other.
[vars]
DATA_PLANE_URL = "https://ornbhvaijcpsbcgquzhd.supabase.co/functions/v1/mcp"

# OAuth clients, authorization codes and tokens. Everything is stored as a
# SHA-256 digest, never as the value, so a dump of this namespace yields no
# usable credential. Codes carry a 5-minute TTL and are deleted on redemption;
# refresh tokens rotate, so a stolen one is usable at most once.
[[kv_namespaces]]
binding = "OAUTH"
id = "ca7371ea5ae946e6bf2b9607d70b3b18"

# THE DISPATCHER TICK NO LONGER LIVES HERE.
#
# This Worker carried `crons = ["* * * * *"]` from 14:25:35 UTC on 2026-09-15.
# It fired ZERO times in the 95 minutes that followed, confirmed three ways: a
# connected `wrangler tail` that captured a positive-control GET but never a
# scheduled event, the analytics API reporting 0 invocations across windows that
# should have held ~95, and an empty proposals table. The trigger was read back
# from the Cloudflare API as registered, `scheduled()` was present in the
# deployed bundle, all three secrets were bound at runtime, and calling
# /dispatch by hand with the same token returned 200 and wrote a proposal. The
# fault was never on this side, so the schedule moved rather than being debugged
# further.
#
# It now runs as pg_cron inside the Agent Bridge Supabase project, which is
# where the data plane already lives -- see the migrations
# `the_scheduler_moves_into_the_database`,
# `dispatch_tick_reads_its_token_from_the_vault` and
# `the_pg_cron_dispatcher_mints_its_own_token`.
#
# DO NOT ADD A CRON BACK HERE. Two schedulers would each supersede the other's
# open proposal set every minute, and `open` would stop meaning "what the
# dispatcher thinks now".

# Uploaded out of band, never committed:
#   npx wrangler secret put BRIDGE_READER_TOKEN
#   npx wrangler secret put BRIDGE_COORDINATOR_TOKEN
#   npx wrangler secret put BRIDGE_DISPATCHER_TOKEN
#
# If the coordinator secret is absent the Worker REFUSES a write grant rather
# than falling back to the reader -- a silent downgrade would surface as write
# tools missing from tools/list, which is the exact symptom the scope-aware
# forwarding was written to eliminate.

# THE EMPTY SET IS DECLARED, NOT IMPLIED.
#
# Deleting the [triggers] block is NOT enough: `wrangler deploy` with no
# triggers section leaves whatever crons are already registered untouched, and
# the `* * * * *` from 14:25 survived two deploys that way. An empty list is the
# only thing that actually removes them, and it also states the intent loudly
# enough that a future deploy cannot quietly resurrect a second scheduler.
[triggers]
crons = []
